name: Auto Convert Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 安装依赖
        run: pip install PyYAML requests aiohttp

      - name: 🧩 准备基础数据 (物理隔离黑洞)
        run: |
          mkdir -p raw_data data
          go install github.com/urlesistiana/v2dat@latest
          mv $(go env GOPATH)/bin/v2dat .
          
          curl -fL -o geosite.dat "https://github.com/Loyalsoldier/domain-list-custom/releases/latest/download/geosite.dat"
          
          # 🚨 核心：提取纯广告黑洞
          cat /dev/null > data/blackhole_ads.txt
          for tag in 'category-ads-all' 'category-porn'; do
            ./v2dat unpack geosite -o raw_data -f "$tag" geosite.dat || true
            if [ -f "raw_data/geosite_$tag.txt" ]; then cat "raw_data/geosite_$tag.txt" >> data/blackhole_ads.txt; fi
          done
          
          # 🚨 核心：提取纯海外隔离库 (仅用于清洗 GeoSite_CN)
          ./v2dat unpack geosite -o raw_data -f 'geolocation-!cn' geosite.dat || true
          mv 'raw_data/geosite_geolocation-!cn.txt' data/blackhole_foreign.txt || true

          # 下载国内主干道图纸
          ./v2dat unpack geosite -o raw_data -f 'geolocation-cn' geosite.dat || true
          mv 'raw_data/geosite_geolocation-cn.txt' raw_data/geosite_cn.txt || true

          # 🚨 核心：下载 Global_CN (@cn) 规则
          touch data/global_cn_raw.txt
          for tag in aws azure oracle ibm salesforce digitalocean hetzner vultr cloudflare akamai fastly cisco intel amd nvidia qualcomm broadcom ubuntu debian archlinux fedora python golang ruby rust docker kubernetes symantec kaspersky eset drweb adobe autodesk figma canva blender sketchfab github gitlab jetbrains atlassian stackexchange microsoft slack zoom webex trello notion evernote apple samsung sony asus acer hp dell panasonic starbucks mcdonalds nike adidas walmart costco ikea gucci louisvuitton tesla bmw volvo airbnb booking; do
            ./v2dat unpack geosite -o raw_data -f "${tag}@cn" geosite.dat || true
            if [ -f "raw_data/geosite_${tag}@cn.txt" ]; then cat "raw_data/geosite_${tag}@cn.txt" >> data/global_cn_raw.txt; fi
          done

          # 下载 AI 和 游戏图纸
          ./v2dat unpack geosite -o raw_data -f 'category-ai-chat-!cn' geosite.dat || true
          ./v2dat unpack geosite -o raw_data -f 'category-ai-!cn' geosite.dat || true
          cat raw_data/geosite_category-ai* > raw_data/ai_rules.txt || true
          
          ./v2dat unpack geosite -o raw_data -f 'category-games-!cn' geosite.dat || true
          ./v2dat unpack geosite -o raw_data -f 'category-games-cn' geosite.dat || true

      - name: 🧹 执行全量清洗 (Cleaner)
        run: python scripts/cleaner.py

      - name: 🚀 执行编译 (Builder)
        run: python scripts/builder.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 提交
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rule/ data/
          git commit -m "fix: restore AI, Game and Global_CN rules" || exit 0
          git push
