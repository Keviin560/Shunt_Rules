name: Auto Convert Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚑 强制抹除幽灵子模块 (自愈机制)
        run: |
          git rm --cached temp_source || true
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "fix: 彻底抹除幽灵子模块 temp_source" || true
          git push || true

      - name: 💾 恢复域名缓存
        uses: actions/cache@v3
        with:
          path: data/domain_cache.json
          key: ${{ runner.os }}-domain-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-domain-cache-

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 安装依赖库
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install PyYAML requests aiohttp

      - name: 📡 克隆上游规则库 (Blackmatrix7)
        run: git clone --depth 1 https://github.com/blackmatrix7/ios_rule_script.git temp_source

      - name: 🛠️ 部署 Mihomo 编译内核
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases"
          DOWNLOAD_URL=$(curl -sL -H "Authorization: token $GH_TOKEN" $API_URL | jq -r 'map(select(.prerelease==false)) | first | .assets[] | select(.name | contains("linux-amd64") and endswith(".gz") and (contains("compatible") | not)) | .browser_download_url' | head -n 1)
          wget -q -O mihomo.gz "$DOWNLOAD_URL"
          gunzip mihomo.gz
          mv mihomo mihomo-bin
          chmod +x mihomo-bin
          ./mihomo-bin -v
          mv mihomo-bin mihomo

      - name: 🧩 准备基础数据 (源码编译 v2dat & 数据源替换)
        run: |
          mkdir -p raw_data
          
          echo "🛠️ Installing v2dat from source..."
          go install github.com/urlesistiana/v2dat@latest
          mv $(go env GOPATH)/bin/v2dat .
          
          echo "⬇️ Downloading Data Files..."
          wget -q -O geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          # 🟢 域名库：换成 Custom 精修版，自带去广告和直连优化
          wget -q -O geosite.dat https://github.com/Loyalsoldier/domain-list-custom/releases/latest/download/geosite.dat
          
          echo "🔓 Unpacking GeoIP..."
          ./v2dat unpack geoip -o raw_data -f cn geoip.dat
          
          if [ ! -f "raw_data/geoip_cn.txt" ]; then
            echo "❌ GeoIP CN extraction failed!"
            exit 1
          fi
          
          echo "🔓 Unpacking Blacklist IPs..."
          cat /dev/null > raw_data/geoip_black.txt
          for tag in google cloudflare telegram twitter facebook netflix; do
            ./v2dat unpack geoip -o raw_data -f $tag geoip.dat
            if [ -f "raw_data/geoip_$tag.txt" ]; then
              cat "raw_data/geoip_$tag.txt" >> raw_data/geoip_black.txt
              rm "raw_data/geoip_$tag.txt"
            fi
          done
          
          echo "🔓 Unpacking GeoSite (Multi-Track)..."
          
          # 1. 提取国内主干道：基础图纸 + 纯血大厂合并
          for tag in geolocation-cn alibaba tencent baidu bilibili xiaomi netease jd pinduoduo meituan bytedance kuaishou xiaohongshu zhihu douyu huya; do
            ./v2dat unpack geosite -o raw_data -f $tag geosite.dat || true
            if [ -f "raw_data/geosite_$tag.txt" ]; then
              cat "raw_data/geosite_$tag.txt" >> raw_data/geosite_cn_merged.txt
            fi
          done
          mv raw_data/geosite_cn_merged.txt raw_data/geosite_cn.txt

          # 2. 提取免检通道 1：AI 聚合库 (Chat + 常规 AI)
          ./v2dat unpack geosite -o raw_data -f "category-ai-chat-!cn" geosite.dat || true
          ./v2dat unpack geosite -o raw_data -f "category-ai-!cn" geosite.dat || true
          cat raw_data/geosite_category-ai*.txt 2>/dev/null > raw_data/ai_rules.txt || true

          # 3. 提取免检通道 2：国内与国外游戏库
          ./v2dat unpack geosite -o raw_data -f "category-games-!cn" geosite.dat || true
          ./v2dat unpack geosite -o raw_data -f "category-games-cn" geosite.dat || true

      - name: 🧹 执行深度清洗 (Cleaner)
        run: python scripts/cleaner.py

      - name: 🚀 执行编译与文档生成 (Builder)
        run: python scripts/builder.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 提交构建产物
        run: |
          rm -rf temp_source mihomo raw_data v2dat geoip.dat geosite.dat
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ ! -d "rule/Mihomo" ] || [ -z "$(ls -A rule/Mihomo)" ]; then
             echo "⚠️ No rules generated, skipping git ops."
             exit 0
          fi
          
          if [ -f "history.json" ] || git ls-files --error-unmatch history.json > /dev/null 2>&1; then
            git rm -f history.json --ignore-unmatch
          fi
          
          git add rule/Mihomo/ rule/Loon/ data/ README.md
          
          if git diff --staged --quiet; then
            echo "zk: No changes detected."
          else
            git commit -m "chore: auto-sync & clean rules [$(date +'%Y-%m-%d %H:%M')]"
            git push
          fi
