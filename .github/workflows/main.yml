name: Auto Shunt Rules v3.2 (Fix)

on:
  schedule:
    - cron: '0 20 * * *' # 北京时间 04:00 自动更新
  workflow_dispatch:     # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须有写权限

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install PyYAML requests dnspython geoip2

      - name: 🌍 下载 GeoIP 数据库 (MaxMind官方源)
        env:
          MAXMIND_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          mkdir -p data
          echo "正在下载 GeoLite2-Country..."
          
          # 使用 MaxMind 官方接口下载 tar.gz
          # 关键点：使用 &suffix=tar.gz 确保格式正确
          wget -O GeoLite2.tar.gz "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=${MAXMIND_KEY}&suffix=tar.gz"
          
          # 解压
          tar -xzf GeoLite2.tar.gz
          
          # 提取 .mmdb 文件到 data/ 目录
          find . -name "GeoLite2-Country.mmdb" -exec mv {} data/ \;
          
          # 验证
          if [ -f "data/GeoLite2-Country.mmdb" ]; then
            echo "✅ GeoIP 数据库部署成功"
            rm -rf GeoLite2.tar.gz GeoLite2-Country_*
          else
            echo "❌ GeoIP 数据库下载失败，请检查 Secret Key 是否正确！"
            exit 1
          fi

      - name: 🛠️ 部署内核 (Mihomo)
        run: |
          wget -q -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.1/mihomo-linux-amd64-v1.18.1.gz
          gunzip mihomo.gz 
          chmod +x mihomo
          ./mihomo -v

      - name: 🚀 执行构建
        run: python scripts/builder.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 💾 提交产物与缓存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 提交 data 目录下的缓存文件和 rule 目录
          git add data/domain_cache.json data/history.json rule/ README.md || true
          
          if git diff --staged --quiet; then
            echo "zk: No changes detected."
          else
            git commit -m "chore: auto-update rules (v3.2 Stable)"
            git push
          fi
