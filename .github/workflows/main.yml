name: Auto Shunt Rules v3.1

on:
  schedule:
    - cron: '0 20 * * *' # 北京时间 04:00 自动更新
  workflow_dispatch:     # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ✅ 必须给写权限，才能提交缓存

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，避免冲突

      - name: 🐍 配置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: pip install PyYAML requests dnspython geoip2

      - name: 🌍 下载 GeoIP 数据库
        uses: themichailov/geoip-download-action@v1
        with:
          edition: GeoLite2-Country
          license_key: ${{ secrets.MAXMIND_LICENSE_KEY }}
      
      - name: 🚚 部署数据文件
        run: |
          mkdir -p data
          # 将下载的数据库移动到 data 目录
          mv GeoLite2-Country.mmdb data/

      - name: 🛠️ 部署内核 (Mihomo)
        run: |
          wget -q -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.1/mihomo-linux-amd64-v1.18.1.gz
          gunzip mihomo.gz && chmod +x mihomo

      - name: 🚀 执行构建
        run: python scripts/builder.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 💾 提交产物与缓存
        run: |
          # 配置 Git 身份
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # ✅ 核心：只提交 data/ 下的 json 和 rule/ 产物
          git add data/domain_cache.json data/history.json rule/ README.md
          
          # 检查是否有变动，有则提交
          if git diff --staged --quiet; then
            echo "zk: No changes detected."
          else
            git commit -m "chore: auto-update rules (v3.1 Phase 2)"
            git push
          fi
