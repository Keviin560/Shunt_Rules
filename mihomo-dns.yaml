# ==============================================================================
# 0. 全局复用锚点区 (用于大幅精简与复用)
# ==============================================================================
anchors:
  # 探针保活配置
  hc: &hc
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 3000

  # 广告/杂质节点过滤正则
  exclude-junk: &exclude-junk
    "(?i)剩余|到期|过期|官网|流量|联系|套餐|重置|更新|交流群|TG群|QQ群|电报群|群组|邀请|返回|网址|贩卖|倒卖|Expire|Traffic"

  # 地区分组基础模板
  region-base: &region-base
    type: select
    include-all: true
    <<: *hc
    exclude-filter: *exclude-junk

  # 应用分组基础模板
  app-base: &app-base
    type: select
    <<: *hc

  # 拦截组基础模板
  block-base: &block-base
    type: select
    proxies: [REJECT, DIRECT]

  # 规则集模板 (域名 MRS)
  rule-domain: &rule-domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 节点选择

  # 规则集模板 (IP-CIDR MRS)
  rule-ip: &rule-ip
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 节点选择

# ==============================================================================
# 1. 基础与底层优化
# ==============================================================================
keep-alive-interval: 60
dns:
  prefer-h3: false

# ==============================================================================
# 2. 策略组 (Proxy Groups)
# ==============================================================================
proxy-groups:
  # 主节点池
  - name: 节点选择
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/Keviin560/icon/main/src/Locator.png
    <<: *hc
    exclude-filter: *exclude-junk

  # 业务分流组
  - name: AI Rules
    <<: *app-base
    icon: https://raw.githubusercontent.com/Keviin560/icon/main/src/ChatGPT.png
    proxies: [美国节点, 日本节点, 台湾节点, 节点选择]

  - name: YouTube
