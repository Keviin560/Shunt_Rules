  TikTok:         { <<: *rule-domain, url: "https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Mihomo/TikTok.mrs", path: ./rules/TikTok.mrs }
  Spotify:        { <<: *rule-domain, url: "https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Mihomo/Spotify.mrs", path: ./rules/Spotify.mrs }
