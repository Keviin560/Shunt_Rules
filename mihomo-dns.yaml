# 作者：Keviin560
# 更新日期：2026-03-18
# 
# -------------------------------------------------------------------------------------------------------------------------
# 【 ⚙️ 核心架构说明 】
# ->  全局接管 GUI 设置：覆盖客户端的设置 (如端口/嗅探/TUN)，实现底层参数统一
# ->  动态指纹防封：为 TLS 协议 (VMess/VLESS/Trojan/AnyTLS 协议) 动态挂载 random 高熵指纹 (注：YAML为静态，需依赖客户端自身支持)
# ->  五大洲节点自动筛选：Unicode 国旗解码；内置 240+ 国家与城市中英双语及高频三字码字典
# ->  自动隐藏无节点分组 ：没有节点的分组会自动隐藏分组，并自动修复依赖 (注：受限于YAML静态特性，通过 include-all 配合 filter 实现兜底)
# ->  智能规则：识别名字带 "_IP" 的规则按 IP 拦截处理；带 ".txt" 的规则按文本处理
# 
# -------------------------------------------------------------------------------------------------------------------------
# 【 ⚠️ 小白用户必读设置 】
# ->  全局仓库锚点：以下所有图标和规则均已指向 https://raw.githubusercontent.com/Keviin560/
# ->  浏览器防漏： Chrome/Edge 设置 -> 隐私与安全 -> 关闭 "使用安全 DNS"。防止浏览器绕过客户端自己去解析 DNS，导致分流失败
# ->   IPv6 相关设置（二选一）：
#   - 【不用 IPv6，默认】 ：在 [基础设置与全量接管] 和 [DNS 劫持与底层防漏] 里把 [IPv6] 改为 false ；同时在系统的物理网卡里关闭 IPv6
#   - 【用 IPv6】 ：在 [基础设置与全量接管] 和 [DNS 劫持与底层防漏] 里把 [IPv6] 改为 true ，把 IPv6 虚假 IP 池填写 [fc00::/18]；并在物理网卡里选 [使用下面的 DNS 服务器地址]，填入 [::1]
# 
# -------------------------------------------------------------------------------------------------------------------------
# 【 🛠️ 修改与维护】
# ->  如果冷门国家节点未被识别：请在第 4 部分的 `Filter` 锚点 (五大洲兜底扫描) 里，加入对应的中文或英文，比如在欧洲里面加上 `|冰岛`。
# ->  想新增独立国家/地区分组（例如新增“英国节点”）：
#   - 在下方定义一个 `FilterUK` 锚点。
#   - 在 proxy-groups 列表中增加一行 `{name: 英国节点, <<: *ManualSelect, filter: *FilterUK}`
# -------------------------------------------------------------------------------------------------------------------------

# =======================================================
# 0. 基础设置与全量接管 (已强制开启接管)
# =======================================================
mode: rule                     # 强制使用规则分流模式
mixed-port: 7890               # 统一混合代理端口为 7890
allow-lan: true                # 允许局域网里的其他设备（如手机、电视）连上这个代理
log-level: info                # 日志记录级别
ipv6: false                    # ⚠️ 默认关闭 IPv6 (若需开启请改为 true ，并认真阅读头部说明)
find-process-mode: strict      # 严格匹配电脑里的软件进程，分流更准
unified-delay: true            # 显示节点真实的物理延迟，去掉虚高的握手时间
keep-alive-interval: 15        # 探针保活核心：全局 TCP 底层保活，每 15 秒发送心跳包，防 NAT 僵死

# 【流量嗅探器】 强制捕获真实的网站域名，解决 DNS 污染
sniffer:
  enable: true
  override-destination: true   # 强制用嗅探到的真实域名覆盖虚假 IP
  force-domain: ['+']          # 对所有流量进行嗅探
  sniff:
    HTTP:
      ports: [80, 8080]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:                 # 以下域名不嗅探，防止国内智能家居或苹果推送断线
    - 'Mijia Cloud'
    - '*.apple.com'
    - '*.icloud.com'

# 【虚拟网卡 TUN 设置】 物理防漏核心
tun:
  enable: true                 # 强制开启 TUN 虚拟网卡
  stack: system                # 采用系统级网络栈
  auto-route: true             # 自动把全局流量吸入 TUN
  auto-detect-interface: true  # 自动找出口网卡
  dns-hijack: ['any:53']       # 劫持本机所有乱跑的 DNS 域名解析请求
  strict-route: true           # ⚠️ 物理防漏核心：锁死物理网卡并发，彻底切断国内运营商的监控


# =======================================================
# 1. DNS 劫持与底层防漏
# =======================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false                  # ⚠️ 保持与外部基础设置同步
  enhanced-mode: fake-ip       # 秒回假 IP 机制
  fake-ip-range: 198.18.0.1/16 # 假 IP 响应池
  # fake-ip-range6: fc00::/18  # ⚠️ 假 IPv6 响应池，若开启 IPv6 请取消注释
  prefer-h3: true              # 优先使用 HTTP/3 (QUIC) 查询 DNS，降延迟

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 国外的兜底安全 DNS 通道
  nameserver:
    - https://1.1.1.1/dns-query#节点选择
    - https://8.8.8.8/dns-query#节点选择

  # 智能 DNS 分流：国内查直连，国外查 DoH
  nameserver-policy:
    "rule-set:Lan":
      - system
    "rule-set:GeoSite_CN":
      - 223.5.5.5
      - 119.29.29.29
      - 180.184.1.1
    "rule-set:Google":
      - https://1.1.1.1/dns-query#节点选择
      - https://8.8.8.8/dns-query#节点选择
    "rule-set:YouTube":
      - https://1.1.1.1/dns-query#节点选择
      - https://8.8.8.8/dns-query#节点选择
    "rule-set:Netflix":
      - https://1.1.1.1/dns-query#节点选择
      - https://8.8.8.8/dns-query#节点选择

  # 💡 Fake-IP 过滤器：强制让这些域名返回真实 IP
  fake-ip-filter:
    - rule-set:Lan                 # 联动 Lan 规则集，确保局域网设备互访正常
    - stun.* # 豁免 WebRTC/STUN 穿透服务器
    - '*.stun.*'
    - '*.+.msftncsi.com'           # 微软 NCSI 网络状态指示器，获取真实 IP
    - '*.+.msftconnecttest.com'    # 微软连接测试，获取真实 IP
    - '*.+.market.xiaomi.com'
    - '*.local'                    # 豁免 mDNS 局域网多播
    - '*.ptlogin2.qq.com'          # 解决国内快捷登录在 Fake-IP 下失效的顽疾
    - '+.pool.ntp.org'             # 时间同步，防止系统时钟失真导致证书验证失败

# =======================================================
# 2. 锚点定义 (复用结构与正则)
# =======================================================
# 节点选择与保活探针锚点
Probe: &Probe {url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 3000}
ManualSelect: &ManualSelect {type: select, include-all: true, <<: *Probe}

# 规则配置通用锚点
RuleDomain: &RuleDomain {type: http, format: mrs, behavior: domain, interval: 86400, proxy: 节点选择}
RuleIP:     &RuleIP     {type: http, format: mrs, behavior: ipcidr, interval: 86400, proxy: 节点选择}
RuleText:   &RuleText   {type: http, format: text, behavior: domain, interval: 86400, proxy: 节点选择}

# 【独立分组节点扫描】：包含中英文和三字码
