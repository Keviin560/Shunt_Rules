  WinSpy: {type: http, behavior: domain, format: text, interval: 86400, proxy: 节点选择, url: "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/win-spy.txt", path: ./rules/WinSpy.txt}

