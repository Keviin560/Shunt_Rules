# 【 v1.7 更新日志 】
# 1. 修复：彻底修复了 JS 数组中因中文全角逗号导致的语法解析错误，解决分组不生效的问题
# 2. 隐私增强：新增全局拦截外部明文 DNS 查询 (UDP 53 端口)，强制所有 App 走内核加密 DNS
# 3. 防跟踪增强：新增对 telemetry、app-measurement、appsflyer、bugly、umeng 等流氓设备指纹探针的全局封杀
# 4. 备用策略：新增 WebRTC 真实 IP 泄漏防护规则（默认注释屏蔽，供对隐私要求极高者按需开启）
# 
# -----------------------------------------------------------------------------------------
# 【 ⚙️ 核心架构说明 】
# ->  动态指纹防封：为 TLS 协议 (VMess/VLESS/Trojan/AnyTLS 协议) 动态挂载 random 高熵指纹
# ->  五大洲节点自动筛选：Unicode 国旗解码；内置国家与城市三字码字典
# ->  自动隐藏无节点分组 ：没有节点的组会自动隐藏，并自动修复依赖
# ->  智能规则：自动识别名字带 "_IP" 的规则，自动按 IP 拦截处理；带 ".txt" 的规则，自动按文本处理
# ->  注意事项：由于使用了原生 GitHub 链接，请在客户端中开了代理再更新该覆写配置，如果客户端有“订阅更新走代理”和“脚本更新走代理”的功能，请打开，否则会导致超时
# 
# -----------------------------------------------------------------------------------------
# 【 ⚠️ 必读设置 】
# ->  全局仓库锚点：可以自行更改所需的规则或 icon 仓库
# ->  浏览器防漏： Chrome/Edge 设置 -> 隐私与安全 -> 关闭 "使用安全 DNS"，防止浏览器绕过客户端自己去解析 DNS
# ->  Windows 用户：关闭 "智能多宿主名称解析" (组策略或注册表修改)，TUN 模式下防止把 DNS 请求同步给物理网卡
# ->  IPv6 相关设置（二选一）： 
# 【不用 IPv6，默认】 👇
# ---- 客户端内：内核设置和 DNS 设置里关闭 IPv6 
# ---- 系统物理网卡：控制面板 -> 网络和 Internet -> 网络和共享中心 -> 以太网/WLAN -> 属性 -> 取消勾选「Internet 协议版本 6 (TCP/IPv6)」
# ---- 系统虚拟网卡：同上，右键 `mihomo` 虚拟网卡 -> 属性 -> 取消勾选「Internet 协议版本 6 (TCP/IPv6)」
# ---- 清理系统缓存：按 Win+R 输入 cmd，执行 `ipconfig /flushdns` 并回车
# 【用 IPv6】 ：在客户端开启 IPv6，把 IPv6 虚假 IP 池填写 [fc00::/18]；并在电脑物理网卡里选 [使用下面的 DNS 服务器地址]，填入 [::1] 👉 在「Internet 协议版本 6 (TCP/IPv6)」的属性里
# 【可考虑】：浏览器层面物理阉割 QUIC：在 Chrome 或 Edge 浏览器地址栏输入：chrome://flags (Edge 输入 edge://flags) → 搜索：QUIC → 找到 Experimental QUIC protocol，把后面的 Default 改成 Disabled → 重启浏览器
# 
# -----------------------------------------------------------------------------------------
# 【 🛠️ 修改与维护】
# ->  如果冷门国家节点未被识别：请在第 1 部分的 `continentRegexes` (五大洲兜底扫描) 里，加入对应的中文或英文，比如在欧洲里面加上 `|冰岛`。
# ->  想新增独立国家/地区分组（例如新增“英国节点”）：
#      找分组：在独立分组节点筛选中加正则
#      加空盒：增加该地区的 policy 组
#      上名单：挂载进对应的分流组
# 
# -----------------------------------------------------------------------------------------
# 【 📝 GUI 界面设置备忘录 (基础参数由客户端接管) 】
# ->  [基础设置]：
#      混合端口：7890
#      局域网连接：开启 (按需开启)
#      IPv6：关闭 (本次配置根据要求采用【用 IPv6】方案开启)
# ->  [虚拟网卡 (TUN) 设置]：
#      状态：开启
#      堆栈：system
#      开启：严格路由、自动设置路由规则、自动选择流量出口
#      DNS 劫持：any:53
# ->  [内核设置]：
#      开启：查找进程、存储选择节点、存储 FakelP 、使用 RTT 延迟测试（统一延迟测试）、 TCP 并发
# ->  [域名嗅探设置]：
#      HTTP 端口嗅探：80, 8080
#      TLS 端口嗅探：443, 8443
#      QUIC 端口嗅探：443, 8443
#      跳过域名嗅探：Mijia Cloud, *.apple.com, *.icloud.com
#      开启：覆盖连接地址、对真实 IP 映射嗅探、对未映射 IP 地址嗅探
# ->  [DNS 设置]：
#      IPv6：开启 (根据要求采用【用 IPv6】方案)
#      基础服务器：223.5.5.5 | 119.29.29.29
#      默认解析服务器：https://1.1.1.1/dns-query#节点选择 | https://8.8.8.8/dns-query#节点选择
#      直连解析服务器：223.5.5.5 | 119.29.29.29 | 180.184.1.1
#      代理节点解析服务器：https://dns.alidns.com/dns-query | https://doh.pub/dns-query
#      域名解析策略：
#      左侧 rule-set:Lan，右侧 system
#      左侧 rule-set:Google (含 YouTube, Netflix 等防漏规则集)，右侧 https://1.1.1.1/dns-query#节点选择
#      Fake-IP 过滤: rule-set:Lan, *.stun.*, +.msftncsi.com, +.msftconnecttest.com, +.market.xiaomi.com, *.local, *.ptlogin2.qq.com, +.pool.ntp.org
#      连接遵守规则：关闭
# =========================================================================================

# -----------------------------------------------------------------------------------------
# 0. 全局复用锚点区 (用于精简配置与统一维护)
# -----------------------------------------------------------------------------------------
anchors:
  # 探针保活配置
  hc: &hc
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 3000

  # 广告/杂质节点过滤正则
  exclude-junk: &exclude-junk "(?i)剩余|到期|过期|官网|流量|联系|套餐|重置|更新|交流群|TG群|QQ群|电报群|群组|邀请|返回|网址|贩卖|倒卖|Expire|Traffic"

  # 地区分组基础模板
  region-base: &region-base
    type: select
    include-all: true
    <<: *hc
    exclude-filter: *exclude-junk

  # 应用分组基础模板
  app-base: &app-base
    type: select
    <<: *hc

  # 拦截组基础模板
  block-base: &block-base
    type: select
    proxies: [REJECT, DIRECT]

  # 规则集模板 (域名 MRS)
  rule-domain: &rule-domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 节点选择

  # 规则集模板 (IP-CIDR MRS)
  rule-ip: &rule-ip
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 节点选择

# -----------------------------------------------------------------------------------------
# 1. 基础与底层优化 (整合 GUI 界面设置、内核设置、TUN 模式及用 IPv6 配置)
# -----------------------------------------------------------------------------------------
# [基础设置]
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
keep-alive-interval: 60

# [IPv6 启用与系统注意事项]
# ⚠️ 电脑物理网卡：控制面板 -> 网络和共享中心 -> 以太网/WLAN -> 属性 -> 「Internet 协议版本 6 (TCP/IPv6)」属性
# 选「使用下面的 DNS 服务器地址」，填入 [::1]
ipv6: true

# [内核设置]
tcp-concurrent: true                      # TCP 并发
unified-delay: true                       # 使用 RTT 延迟测试（统一延迟测试）
find-process-mode: strict                 # 查找进程
profile:
  store-selected: true                    # 存储选择节点
  store-fake-ip: true                     # 存储 FakeIP

# [虚拟网卡 (TUN) 设置]
# ⚠️ Windows 用户：请关闭 "智能多宿主名称解析" (组策略/注册表)，TUN 模式下防止把 DNS 请求同步给物理网卡
tun:
  enable: true                            # 状态：开启
  stack: system                           # 堆栈：system
  strict-route: true                      # 开启：严格路由
  auto-route: true                        # 开启：自动设置路由规则
  auto-detect-interface: true             # 开启：自动选择流量出口
  dns-hijack:
    - any:53                              # DNS 劫持：any:53
    - tcp://any:53

# [域名嗅探设置]
# ⚠️ 可考虑在浏览器地址栏输入 chrome://flags / edge://flags 禁用 Experimental QUIC protocol
sniffer:
  enable: true
  override-destination: true              # 开启：覆盖连接地址
  force-dns-mapping: true                 # 开启：对真实 IP 映射嗅探
  parse-pure-ip: true                     # 开启：对未映射 IP 地址嗅探
  sniff:
    HTTP:
      ports: [80, 8080]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "*.apple.com"
    - "*.icloud.com"

# [DNS 设置]
# ⚠️ 浏览器防漏：Chrome/Edge 设置 -> 隐私与安全 -> 关闭 "使用安全 DNS"，防止浏览器绕过客户端解析
dns:
  enable: true
  ipv6: true                              # DNS 开启 IPv6
  prefer-h3: false
  respect-rules: false                    # 连接遵守规则：关闭
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16            # IPv4 虚假 IP 池
  fake-ip-range6: fc00::/18               # IPv6 虚假 IP 池填写 [fc00::/18]

  # 基础服务器 (默认名称解析器)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认解析服务器
  nameserver:
    - 'https://1.1.1.1/dns-query#节点选择'
    - 'https://8.8.8.8/dns-query#节点选择'

  # 直连解析服务器
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1

  # 代理节点解析服务器
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'

  # 域名解析策略 (Nameserver-Policy)
  nameserver-policy:
    "rule-set:Lan": system
    "rule-set:Google": "https://1.1.1.1/dns-query#节点选择"
    "rule-set:YouTube": "https://1.1.1.1/dns-query#节点选择"
    "rule-set:Netflix": "https://1.1.1.1/dns-query#节点选择"

  # Fake-IP 过滤
  fake-ip-filter:
    - "rule-set:Lan"
    - "*.stun.*"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    - "+.market.xiaomi.com"
    - "*.local"
    - "*.ptlogin2.qq.com"
    - "+.pool.ntp.org"

