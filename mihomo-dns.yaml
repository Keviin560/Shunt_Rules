# -------------------------------------------------------
# [ 核心架构说明 ]
#  >>> 分流逻辑：Split-Horizon DNS (水平分割 DNS) + "Fake-IP" 模式
#    - 国内流量：由 nameserver-policy 引导至字节/阿里/腾讯 DNS -> 解析真实 IP -> 直连
#    - 国外流量：走 Fake-IP 模式 -> 立即返回假 IP -> 流量封装发送至机场节点 -> 远端解析
#    - 联动机制：DNS 策略 (nameserver-policy) 与分流规则 (rule-providers) 绑定
#
# [ ⚠️ 必读设置 ]
#  >>> 开启 TUN 模式：
#    在 Mihomo/Clash 界面必须开启 "TUN Mode" (服务模式/虚拟网卡)，否则 Fake-IP 无法接管所有流量
# >>> 关闭浏览器安全 DNS：
#    Chrome/Edge 设置 -> 隐私与安全 -> 关闭 "使用安全 DNS"。防止浏览器会绕过客户端自己去解析 DNS，导致分流失败。
# >>> Windows 用户建议：
#    建议关闭 "智能多宿主名称解析" (组策略或注册表修改)，防止 DNS 请求泄露；同时也可考虑把 并行 DNS 性能优化 干掉


# -------------------------------------------------------
# 1. 基础设置
# -------------------------------------------------------
# 注：以下注释掉的设置，请确保客户端进行对应的设置
# mode: rule    # 分流模式
# mixed-port: 7890    # 混合端口
# allow-lan: true    # 局域网代理
# log-level: info
# ipv6: true    # IPV6 开关
# external-controller: 0.0.0.0:9090
# secret: ''
find-process-mode: strict
global-client-fingerprint: chrome

# 统一延迟计算。测速时去除 TCP 握手时间，只计算传输层的物理延迟
unified-delay: true


# -------------------------------------------------------
# 2. DNS 设置
# -------------------------------------------------------
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  
  # Fake-IP 模式（增强模式）。本地 DNS 不进行真实解析解析，杜绝 DNS 污染和泄漏
  # 原理：客户端发起请求 -> 秒回假 IP (198.18.x.x) -> 建立连接 -> 匹配规则分流
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  # 优先使用 HTTP/3 (QUIC) 查询 DNS
  prefer-h3: true

  # [默认 DNS] 解析国外域名 + 兜底
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # [分流策略] Nameserver-Policy. 只有命中这里规则的域名，才会走指定的 DNS，否则全部走上面的默认 DNS (国外)
  nameserver-policy:
    # 1. 局域网域名 -> 走系统 DNS (路由器/内网DNS)
    "rule-set:Lan":
      - system

    # 2. 国内域名 -> 走国内 DNS (UDP直连)，仅绑定 GeoSite_CN (域名规则)
    "rule-set:GeoSite_CN":
      - 180.184.1.1   # 火山引擎 (字节跳动)
      - 223.5.5.5     # 阿里 DNS
      - 119.29.29.29  # 腾讯 DNSPod

    # 3. 国外大厂 -> 强制走 DoH (双重防污染)
    "rule-set:Google,YouTube,Netflix":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

  # Fake-IP 过滤名单。这些域名不走 Fake-IP，强制解析真实 IP，可以解决局域网互联、微软连通性测试
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.windows.com"
    - "time.apple.com"


# -------------------------------------------------------
# 3. 锚点与过滤器
# -------------------------------------------------------
# 定义规则源的通用属性，减少重复代码
RuleDomain: &RuleDomain {type: http, format: mrs, behavior: domain, interval: 86400, proxy: 节点选择}
RuleIP:     &RuleIP     {type: http, format: mrs, behavior: ipcidr, interval: 86400, proxy: 节点选择}
RuleText:   &RuleText   {type: http, format: text, behavior: domain, interval: 86400, proxy: 节点选择}
ManualSelect: &ManualSelect {type: select, include-all: true}

# 地区筛选正则 (自动吸附节点)
FilterHK: &FilterHK '(?i)(?:🇭🇰|香港|Hong\s?Kong|\b(?:HK|HKG)\d*\b)'
FilterMO: &FilterMAC '(?i)(?:🇲🇴|澳门|Maca[ou]|\b(?:MO|MAC)\b)'
