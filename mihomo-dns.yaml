# 作者：Keviin560
# 更新日期：2026-03-20
# 
# -------------------------------------------------------------------------------------------------------------------------
# 【 ⚠️ 小白用户必读设置 】
# ->  浏览器防漏： Chrome/Edge 设置 -> 隐私与安全 -> 关闭 "使用安全 DNS"。防止浏览器绕过客户端自己去解析 DNS
# ->  Windows 用户：关闭 "智能多宿主名称解析" (组策略或注册表修改)，TUN 模式下防止 Windows 把 DNS 请求同步给物理网卡
# ->  IPv6 相关设置（二选一）：
#   - 【不用 IPv6，默认】 ：在客户端的基础设置和 DNS 设置里关闭 IPv6 ；同时在系统的物理网卡（一般是 WLAN 或 以太网）里关闭 IPv6
#   - 【用 IPv6】 ：在客户端开启 IPv6，把 IPv6 虚假 IP 池填写 [fc00::/18]；并在电脑物理网卡里选 [使用下面的 DNS 服务器地址]，填入 [::1]
# 
# -------------------------------------------------------------------------------------------------------------------------
# 【 🛠️ 修改与维护】
# ->  如果冷门国家节点未被识别：请在下方 `Filter` 锚点 (五大洲兜底扫描) 里，加入对应的中文或英文，比如在欧洲里面加上 `|冰岛`。
# ->  想新增独立国家/地区分组（例如新增“英国节点”）：
#   - 找分组：在下方定义一个 `FilterUK: &FilterUK '(?i)(?:英国|伦敦|UK)'`
#   - 上名单：在 proxy-groups 列表中增加一行 `- {name: 英国节点, <<: *ManualSelect, filter: *FilterUK, icon: "https://.../UK.png"}`
# 
# -------------------------------------------------------------------------------------------------------------------------
# 【 📝 GUI 界面设置备忘录 】
# ->  [基础设置]：
#   - 混合端口：7890
#   - 局域网连接：开启 (按需)
# ->  [虚拟网卡 (TUN) 设置]：
#   - 状态：开启
#   - 堆栈：system
#   - 自动路由：开启
#   - 自动检测接口：开启
#   - DNS 劫持：any:53
#   - 严格路由：开启
# ->  [内核设置]：
#   - 查找进程：开启
#   - 存储选择节点：开启
#   - 存储 FakelP：开启
#   - 使用 RTT 延迟测试：开启
#   - TCP 并发：开启
# ->  [域名嗅探设置]：
#   - HTTP 端口嗅探：80, 8080
#   - TLS 端口嗅探：443, 8443
#   - QUIC 端口嗅探：443, 8443
#   - 跳过域名嗅探：Mijia Cloud, *.apple.com, *.icloud.com
#   - 开启：覆盖连接地址、对真实 IP 映射嗅探、对未映射 IP 地址嗅探
# ->  [DNS 设置]：
#   - 基础服务器：223.5.5.5 | 119.29.29.29
#   - 默认解析服务器：https://1.1.1.1/dns-query#节点选择 | https://8.8.8.8/dns-query#节点选择
#   - 直连解析服务器：223.5.5.5 | 119.29.29.29 | 180.184.1.1
#   - 代理节点解析服务器：https://doh.pub/dns-query | https://dns.alidns.com/dns-query
#   - 域名解析策略（这里做一些强制要求）：
#       左侧 rule-set:Lan，右侧 system
#       左侧 rule-set:Google (含 YouTube, Netflix 等需要防漏的规则集，按需添加)，右侧 https://1.1.1.1/dns-query#节点选择
#   - Fake-IP 过滤: rule-set:Lan, *.stun.*, *.+.msftncsi.com, *.+.msftconnecttest.com, *.+.market.xiaomi.com, *.local, *.ptlogin2.qq.com, +.pool.ntp.org
# -------------------------------------------------------------------------------------------------------------------------

# =======================================================
# 0. 核心底层性能优化
# =======================================================
keep-alive-interval: 15        # 探针保活核心：全局 TCP 底层保活，每 15 秒发送心跳包，防 NAT 僵死

dns:
  prefer-h3: true              # 优先使用 HTTP/3 (QUIC) 查询 DNS，降延迟


# =======================================================
# 1. 锚点定义区
# =======================================================
# 探针注入核心：通过锚点将 204 探针批量挂载到所有手动选择组
Probe: &Probe {url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 3000}
ManualSelect: &ManualSelect {type: select, include-all: true, <<: *Probe}

# 定义规则源的通用属性
RuleDomain: &RuleDomain {type: http, format: mrs, behavior: domain, interval: 86400, proxy: 节点选择}
RuleIP:     &RuleIP     {type: http, format: mrs, behavior: ipcidr, interval: 86400, proxy: 节点选择}
RuleText:   &RuleText   {type: http, format: text, behavior: domain, interval: 86400, proxy: 节点选择}

# 【独立分组】：港澳台日韩新美
FilterHK: &FilterHK '(?i)(?:🇭🇰|香港|Hong\s?Kong|\b(?:HK|HKG)\d*\b)'
FilterMO: &FilterMAC '(?i)(?:🇲🇴|澳门|Maca[ou]|\b(?:MO|MAC)\b)'
FilterTW: &FilterTW '(?i)(?:🇹🇼|台湾|Tai(?:wan)?|\b(?:TW|TWN)\d*\b)'
FilterJP: &FilterJP '(?i)(?:🇯🇵|日本|川日|东京|大阪|埼玉|Japan|\b(?:JP|JPN)\d*\b)'
FilterKR: &FilterKR '(?i)(?:🇰🇷|韩国|韓|首尔|Korea|\b(?:KR|KOR)\d*\b)'
FilterSG: &FilterSG '(?i)(?:🇸🇬|新加坡|狮|Singapore|\b(?:SG|SGP)\d*\b)'
FilterUS: &FilterUS '(?i)(?:🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|拉斯维加斯|United States|\b(?:US|USA)\d*\b)'

# 【五大洲】：冷门国家丢进对应大洲
