# ==============================================================================
# 3. 规则集定义 (Rule Providers)
# ==============================================================================
rule-providers:
  # 外部第三方规则
  AdRules:        { <<: *rule-domain, url: "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules-mihomo.mrs", path: ./rules/AdRules.mrs }
  WinSpy:         { type: http, behavior: domain, format: text, interval: 86400, proxy: 节点选择, url: "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/win-spy.txt", path: ./rules/WinSpy.txt }

  # 域名规则 (MRS)
  Privacy:        { <<: *rule-domain, url: "https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Mihomo/Privacy.mrs", path: ./rules/Privacy.mrs }
  Hijacking:      { <<: *rule-domain, url: "https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Mihomo/Hijacking.mrs", path: ./rules/Hijacking.mrs }
  Lan:            { <<: *rule-domain, url: "https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Mihomo/Lan.mrs", path: ./rules/Lan.mrs }
  Game_CN:        { <<: *rule-domain, url: "https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Mihomo/Game_CN.mrs", path: ./rules/Game_CN.mrs }
