# ===== 9. 分流规则 ================
rules:
  # ---- BT/PT 流量拦截 ----
  # 必须将 172.18.0.5/32 替换为你 NAS 上运行 BT 客户端的 Docker 容器的真实 IP 或网段
  # 在 NAS 的 SSH 终端执行以下指令（将中文部分替换为你真实的下载器容器名）：docker inspect 你的下载容器名 | grep IPAddress
  # - SRC-IP-CIDR,172.18.0.5/32,DIRECT
  # - SRC-PORT,6881-6889,DIRECT
  
  # ---- 净化与拦截 ----
  # 阻断海外 QUIC (UDP 443)，但排除中国 IP (保留国内 QUIC，如 B站/抖音)
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((GEOIP,CN,no-resolve)))),REJECT
  # 阻断所有外部 UDP DNS 请求 (强制所有 DNS 走内部 DNS 模块)
  - AND,((NETWORK,UDP),(DST-PORT,53)),REJECT
  # 广告域名 -> 广告拦截策略组 (默认 REJECT)
  - RULE-SET,AdRules,广告拦截
  
  # DOMAIN-REGEX 正则匹配以 crash/metrics/track 等开头的日志上报域名
  - DOMAIN-REGEX,^(crash|metrics|track|report|api|stat|collect|telemetry|apm|sdk|event|events|trace|beacon|analytics|probe|upload|diag)\.log\.,REJECT  
  - DOMAIN-KEYWORD,telemetry,REJECT
  - DOMAIN-KEYWORD,app-measurement,REJECT
  - DOMAIN-KEYWORD,appsflyer,REJECT
  - DOMAIN-KEYWORD,bugly,REJECT
  - DOMAIN-KEYWORD,umeng,REJECT
  - RULE-SET,Privacy,隐私保护
  - RULE-SET,Hijacking,反劫持
  - RULE-SET,Hijacking_IP,反劫持,no-resolve

  # ---- 局域网与基础直连 ----
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Lan_IP,DIRECT,no-resolve
  - RULE-SET,GameDownloadCN,DIRECT
  - DST-PORT,123,DIRECT

  # ---- P2P/BT 端口与关键字直连 ----
  - DST-PORT,51413,DIRECT
  - DOMAIN-KEYWORD,tracker,DIRECT
  - DOMAIN-KEYWORD,torrent,DIRECT
  - DOMAIN-KEYWORD,announce,DIRECT

  # ---- 海外平台分流 ----
  - RULE-SET,AI_Rules,AI Rules
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Netflix,Netflix
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Google,Google
  - RULE-SET,iCloud,Apple
  - RULE-SET,AppleID,Apple
  - RULE-SET,Apple,Apple
  - RULE-SET,Game_Proxy,海外游戏

  # ---- 国内直连 ----
  - RULE-SET,Global_CN,DIRECT
  - RULE-SET,Game_CN,DIRECT
  - RULE-SET,GeoSite_CN,DIRECT

  # ---- IP 补漏层 ----
  - RULE-SET,Telegram_IP,Telegram,no-resolve
  - RULE-SET,Google_IP,Google,no-resolve
  - RULE-SET,YouTube_IP,YouTube,no-resolve
  - RULE-SET,Netflix_IP,Netflix,no-resolve
  - RULE-SET,GeoIP_CN_IP,DIRECT

  # ---- 第七层：兜底 ----
  - MATCH,兜底策略
